name: Publish verified npm archive
on:
  workflow_dispatch:
    inputs:
      artifact_run_id:
        description: Completed packaging run from this repository
        required: true
        type: string
permissions:
  contents: read
  actions: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - name: Require a successful package producer at this exact source commit
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_RUN_ID: ${{ inputs.artifact_run_id }}
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          const id = process.env.ARTIFACT_RUN_ID;
          if (!/^\d+$/.test(id ?? '')) throw Error('A numeric workflow run ID is required');
          const run = JSON.parse(execFileSync('gh', ['api', `repos/${process.env.GITHUB_REPOSITORY}/actions/runs/${id}`]));
          const commit = execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim();
          if (run.status !== 'completed' || run.conclusion !== 'success' || run.path !== '.github/workflows/package-npm.yml' || run.head_sha !== commit) throw Error('A successful package-npm run at this exact source commit is required');
          NODE
      - uses: actions/download-artifact@v4
        with:
          name: public-npm
          run-id: ${{ inputs.artifact_run_id }}
          github-token: ${{ github.token }}
          path: .runtime/publication
      - name: Publish exact verified bytes using npm trusted publishing
        run: node tools/publish-npm.mjs --receipt .runtime/publication/build.json --execute
