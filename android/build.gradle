buildscript {
    repositories { google(); mavenCentral() }
    dependencies { classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:${rootProject.ext.has('kotlinVersion') ? rootProject.ext.kotlinVersion : '2.2.0'}") }
}
apply plugin: "com.android.library"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"
def supportedArchitectures = ["arm64-v8a", "x86_64"]
def requestedArchitectures = (findProperty("reactNativeArchitectures") ?: "arm64-v8a,x86_64").split(",").collect { it.trim() }
if (requestedArchitectures.any { !supportedArchitectures.contains(it) }) {
    throw new GradleException("WeappContainer supports arm64-v8a,x86_64; set reactNativeArchitectures=arm64-v8a,x86_64 in gradle.properties")
}
react {
    jsRootDir = file("../src")
    libraryName = "WeappContainerSpec"
    codegenJavaPackageName = "com.sonofmagic.weapp.container.reactnative"
}
android {
    namespace "com.sonofmagic.weapp.container.reactnative"
    compileSdk rootProject.ext.has('compileSdkVersion') ? rootProject.ext.compileSdkVersion : 37
    defaultConfig { minSdk 26; ndk { abiFilters "arm64-v8a", "x86_64" } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    kotlinOptions { jvmTarget = '17' }
}
// The npm distribution carries its own Maven repository. No Rust or sibling checkout is needed.
def sdkMaven = file("../native/android/maven")
def requiredAar = new File(sdkMaven, 'com/sonofmagic/weapp/weapp-container-android/0.1.0-preview.5.4/weapp-container-android-0.1.0-preview.5.4.aar')
if (!requiredAar.isFile()) throw new GradleException('Missing pinned Android SDK; run node tools/prepare-native.mjs --platform android --arch universal from sdk-react-native. Core sources are never built by this plugin.')

rootProject.allprojects { repositories { maven { url = sdkMaven.toURI() } } }
dependencies {
    implementation "com.facebook.react:react-android"
    implementation "com.sonofmagic.weapp:weapp-container-android:0.1.0-preview.5.4"
}
